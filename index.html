<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Chess</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app">
      <section class="side">
        <h1>Chess</h1>

        <div class="panel">
          <label for="mode">Mode</label>
          <select id="mode">
            <option value="computer">Human vs Computer</option>
            <option value="human">Human vs Human</option>
          </select>

          <label for="color">Your color</label>
          <select id="color">
            <option value="white">White</option>
            <option value="black">Black</option>
          </select>

          <label for="difficulty">Computer difficulty</label>
          <select id="difficulty">
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="impossible">Impossible</option>
          </select>

          <label for="boardTheme">Board style</label>
          <select id="boardTheme">
            <option value="walnut">Walnut club</option>
            <option value="emerald">Emerald tournament</option>
            <option value="midnight">Midnight blue</option>
            <option value="marble">Marble slate</option>
            <option value="rosewood">Rosewood</option>
          </select>

          <label for="pieceStyle">Piece style</label>
          <select id="pieceStyle">
            <option value="carved">Carved</option>
            <option value="classic">Classic print</option>
            <option value="tokens">Round disks</option>
            <option value="letters">Letter marks</option>
          </select>

          <button id="newGame">New game</button>
        </div>

        <div class="status" aria-live="polite">
          <div id="turnText">White to move</div>
          <div id="gameText">Choose a piece to start.</div>
        </div>

        <div class="moves">
          <h2>Moves</h2>
          <ol id="moveList"></ol>
        </div>
      </section>

      <section class="board-wrap">
        <div id="board" class="board" aria-label="Chess board"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
